name: Kiln

options:
  minimumXcodeGenVersion: 2.45.4
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.9"
    TARGETED_DEVICE_FAMILY: "1,2"

packages:
  SwiftSyntax:
    url: https://github.com/swiftlang/swift-syntax.git
    from: "602.0.0"

targets:
  Kiln:
    type: application
    platform: iOS
    sources:
      - path: Kiln
      # The on-device toolchain's data (SDK, compiler resources, runtime helpers), assembled by the
      # Build Kiln workflow. Copied into the app as a folder named Toolchain.
      - path: build/ToolchainBundle/Toolchain
        type: folder
        buildPhase: resources
        optional: true
    configFiles:
      Debug: Configuration/Kiln.xcconfig
      Release: Configuration/Kiln.xcconfig
    settings:
      base:
        SWIFT_OBJC_BRIDGING_HEADER: Kiln/Toolchain/Kiln-Bridging-Header.h
        CLANG_CXX_LANGUAGE_STANDARD: c++17
        # LLVM and Swift are built without RTTI.
        GCC_ENABLE_CPP_RTTI: NO
        PRODUCT_BUNDLE_IDENTIFIER: app.kiln.ide
        PRODUCT_NAME: Kiln
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_FILE: Configuration/Info.plist
        INFOPLIST_KEY_CFBundleDisplayName: Kiln
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: "UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        MARKETING_VERSION: "0.1"
        CURRENT_PROJECT_VERSION: "1"
        SUPPORTS_MACCATALYST: NO
    dependencies:
      - package: SwiftSyntax
        product: SwiftSyntax
      - package: SwiftSyntax
        product: SwiftParser
      - package: SwiftSyntax
        product: SwiftParserDiagnostics
      - package: SwiftSyntax
        product: SwiftDiagnostics
    scheme: {}
