name: Build Kiln

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - "claude/**"
  pull_request:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 60
    permissions:
      contents: read
      actions: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show Xcode version
        run: |
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version

      - name: Install XcodeGen
        run: brew install xcodegen

      # The on-device compiler comes from the latest successful Toolchain run on this branch
      # (or main). Without it, Kiln still builds, with the compiler disabled.
      - name: Fetch the on-device toolchain
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          RUN_ID=""
          for branch in "${{ github.head_ref || github.ref_name }}" main; do
            RUN_ID=$(gh run list --repo "${{ github.repository }}" --workflow toolchain.yml --branch "$branch" \
              --status success --limit 1 --json databaseId --jq '.[0].databaseId // empty')
            [ -n "$RUN_ID" ] && break
          done
          if [ -z "$RUN_ID" ]; then
            echo "::warning::No successful Toolchain run found; building Kiln without the on-device compiler."
            exit 0
          fi
          echo "Using Toolchain run $RUN_ID"
          mkdir -p build/toolchain
          gh run download "$RUN_ID" --repo "${{ github.repository }}" --pattern '*-ios-*' --dir build/toolchain
          mkdir -p build/toolchain/llvm build/toolchain/swift
          tar -xzf build/toolchain/llvm-ios-*/llvm-ios-*.tar.gz -C build/toolchain/llvm
          tar -xzf build/toolchain/swift-ios-*/swift-ios-*.tar.gz -C build/toolchain/swift
          Toolchain/assemble-app-toolchain.sh build/toolchain/llvm build/toolchain/swift

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Resolve packages
        run: xcodebuild -resolvePackageDependencies -project Kiln.xcodeproj -scheme Kiln

      - name: Build (unsigned)
        run: |
          mkdir -p build
          xcodebuild archive \
            -project Kiln.xcodeproj \
            -scheme Kiln \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath build/Kiln.xcarchive \
            -skipMacroValidation \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            | tee build/xcodebuild.log | grep -E "error:|warning:|BUILD|ARCHIVE" || true
          test -d build/Kiln.xcarchive/Products/Applications/Kiln.app

      - name: Check Info.plist
        run: |
          PLIST=build/Kiln.xcarchive/Products/Applications/Kiln.app/Info.plist
          plutil -p "$PLIST"
          # Both are needed for Kiln's projects to show up in the Files app.
          for key in UIFileSharingEnabled LSSupportsOpeningDocumentsInPlace; do
            test "$(/usr/libexec/PlistBuddy -c "Print :$key" "$PLIST")" = "true" || { echo "::error::$key is not true"; exit 1; }
          done

      - name: Package IPA
        run: |
          mkdir -p build/Payload
          cp -R build/Kiln.xcarchive/Products/Applications/Kiln.app build/Payload/
          (cd build && zip -qry Kiln.ipa Payload)
          ls -lh build/Kiln.ipa

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: Kiln-unsigned-ipa
          path: build/Kiln.ipa
          retention-days: 14

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xcodebuild-log
          path: build/xcodebuild.log
          if-no-files-found: ignore
