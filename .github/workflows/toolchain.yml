name: Toolchain

# Builds Kiln's on-device toolchain: LLVM, Clang and lld (stage 1), then the Swift compiler (stage 2), for iOS.
# Takes hours, so it runs on demand and when the toolchain scripts change.

on:
  workflow_dispatch:
    inputs:
      swift_version:
        description: "Swift version to build, e.g. 6.3 (empty = the version of the runner's Xcode)"
        required: false
        default: ""
  push:
    branches:
      - "claude/**"
    paths:
      - ".github/workflows/toolchain.yml"
      - "Toolchain/**"

concurrency:
  group: toolchain-${{ github.ref }}
  cancel-in-progress: true

jobs:
  llvm:
    runs-on: macos-26
    timeout-minutes: 345

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Pick Swift version
        id: version
        run: |
          xcodebuild -version
          xcrun swift --version
          FULL="${{ inputs.swift_version }}"
          if [ -z "$FULL" ]; then
            FULL=$(xcrun swift --version 2>&1 | sed -n 's/.*Swift version \([0-9][0-9.]*\).*/\1/p' | head -1)
          fi
          VERSION=$(echo "$FULL" | cut -d. -f1-2)
          # Branch names vary between releases: swift/release/6.3, 6.3.1, 6.4.x, …
          BRANCH=""
          for candidate in "$FULL" "$VERSION" "$VERSION.x" "$VERSION.0"; do
            if git ls-remote --exit-code --heads https://github.com/swiftlang/llvm-project.git "swift/release/$candidate" >/dev/null; then
              BRANCH="swift/release/$candidate"
              break
            fi
          done
          if [ -z "$BRANCH" ]; then
            echo "::error::swiftlang/llvm-project has no release branch for Swift $FULL"
            exit 1
          fi
          echo "Swift $VERSION → llvm-project $BRANCH"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "full=$FULL" >> "$GITHUB_OUTPUT"
          echo "branch=$BRANCH" >> "$GITHUB_OUTPUT"

      - name: Fetch llvm-project
        run: |
          git clone --depth 1 --branch "${{ steps.version.outputs.branch }}" \
            https://github.com/swiftlang/llvm-project.git "$RUNNER_TEMP/llvm-project"
          git -C "$RUNNER_TEMP/llvm-project" log --oneline -1

      - name: Install build tools
        run: brew install ninja ccache

      - name: Restore compiler cache
        uses: actions/cache/restore@v4
        with:
          path: ~/Library/Caches/ccache
          key: ccache-llvm-${{ steps.version.outputs.version }}-${{ github.run_id }}
          restore-keys: ccache-llvm-${{ steps.version.outputs.version }}-

      - name: Build LLVM, Clang and lld for iOS
        env:
          CCACHE_DIR: ~/Library/Caches/ccache
          CCACHE_MAXSIZE: 6G
        run: |
          export CCACHE_DIR="$HOME/Library/Caches/ccache"
          ccache --zero-stats
          Toolchain/build-llvm.sh "$RUNNER_TEMP/llvm-project" "$RUNNER_TEMP/llvm-build"
          ccache --show-stats

      - name: Link smoke test
        run: Toolchain/smoke/link-smoke.sh "$RUNNER_TEMP/llvm-build/install" "$RUNNER_TEMP/KilnToolchainSmoke.dylib"

      - name: Package
        run: |
          tar -C "$RUNNER_TEMP/llvm-build/install" -czf "$RUNNER_TEMP/llvm-ios-${{ steps.version.outputs.version }}.tar.gz" .
          ls -lh "$RUNNER_TEMP"/*.tar.gz

      - name: Upload LLVM
        uses: actions/upload-artifact@v4
        with:
          name: llvm-ios-${{ steps.version.outputs.version }}
          path: ${{ runner.temp }}/llvm-ios-${{ steps.version.outputs.version }}.tar.gz
          retention-days: 30

      # Stage 2: the Swift compiler.

      - name: Fetch swift and swift-cmark
        run: |
          FULL="${{ steps.version.outputs.full }}"
          VERSION="${{ steps.version.outputs.version }}"
          for repo in swift swift-cmark; do
            BRANCH=""
            for candidate in "$FULL" "$VERSION" "$VERSION.x" "$VERSION.0"; do
              if git ls-remote --exit-code --heads "https://github.com/swiftlang/$repo.git" "release/$candidate" >/dev/null; then
                BRANCH="release/$candidate"
                break
              fi
            done
            test -n "$BRANCH" || { echo "::error::swiftlang/$repo has no release branch for Swift $FULL"; exit 1; }
            git clone --depth 1 --branch "$BRANCH" "https://github.com/swiftlang/$repo.git" "$RUNNER_TEMP/$repo"
            echo "$repo: $BRANCH $(git -C "$RUNNER_TEMP/$repo" log --oneline -1)"
          done

      - name: Build the Swift compiler for iOS
        run: |
          export CCACHE_DIR="$HOME/Library/Caches/ccache" CCACHE_MAXSIZE=6G
          Toolchain/build-swift.sh "$RUNNER_TEMP/swift" "$RUNNER_TEMP/swift-cmark" "$RUNNER_TEMP/llvm-build" "$RUNNER_TEMP/swift-build"
          ccache --show-stats

      - name: Swift link smoke test
        run: |
          Toolchain/smoke/link-swift-smoke.sh "$RUNNER_TEMP/swift-build/install" "$RUNNER_TEMP/llvm-build/install" "$RUNNER_TEMP/KilnSwiftSmoke.dylib"

      - name: Upload link log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: swift-smoke-link-log
          path: ${{ runner.temp }}/KilnSwiftSmoke.dylib.link.log
          if-no-files-found: ignore

      - name: Package Swift
        run: |
          tar -C "$RUNNER_TEMP/swift-build/install" -czf "$RUNNER_TEMP/swift-ios-${{ steps.version.outputs.version }}.tar.gz" .
          ls -lh "$RUNNER_TEMP"/swift-ios-*.tar.gz

      - name: Upload Swift
        uses: actions/upload-artifact@v4
        with:
          name: swift-ios-${{ steps.version.outputs.version }}
          path: ${{ runner.temp }}/swift-ios-${{ steps.version.outputs.version }}.tar.gz
          retention-days: 30

      # Stage 3 groundwork: what the compiler would read from the iPhoneOS SDK.
      - name: Measure the iPhoneOS SDK
        run: |
          SDK="$(xcrun --sdk iphoneos --show-sdk-path)"
          echo "SDK: $SDK"
          du -sh "$SDK"
          du -sh "$SDK/usr/lib/swift" "$SDK/usr/include" "$SDK/System/Library/Frameworks" "$SDK/System/Library/PrivateFrameworks" 2>/dev/null || true
          echo "Swift modules in usr/lib/swift: $(ls -d "$SDK"/usr/lib/swift/*.swiftmodule | wc -l)"
          echo "Largest frameworks:"
          du -sk "$SDK"/System/Library/Frameworks/*.framework | sort -rn | head -15
          echo "SwiftUI module:"
          ls -la "$SDK/System/Library/Frameworks/SwiftUI.framework/Modules/SwiftUI.swiftmodule" || true

      - name: Save compiler cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: ~/Library/Caches/ccache
          key: ccache-llvm-${{ steps.version.outputs.version }}-${{ github.run_id }}
