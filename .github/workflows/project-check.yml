name: Project Check

# Builds a real project with Kiln's own build system (kiln-build: the same project reader, package
# resolver, planner and backend as on the iPhone), using the swift.org compiler of the same version,
# clang and lld as separate processes. Finds the next problems without testing on a phone.

on:
  workflow_dispatch:
    inputs:
      repository:
        description: "GitHub repository to build (owner/name)"
        default: "Seperatebugle21/Echo"
      ref:
        description: "Branch or tag (empty: default branch)"
        default: ""
  push:
    branches:
      - "claude/**"
    paths:
      - ".github/workflows/project-check.yml"
      - "Kiln/Build/**"
      - "Kiln/Project/ZipArchive.swift"
      - "Toolchain/test/KilnCLI/**"
      - "Toolchain/test/MacroCheck/**"
      - "Toolchain/macros/**"

permissions:
  contents: read

jobs:
  check:
    runs-on: macos-26
    timeout-minutes: 90
    env:
      PROJECT_REPO: ${{ github.event.inputs.repository || 'Seperatebugle21/Echo' }}
      PROJECT_REF: ${{ github.event.inputs.ref || '' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install the swift.org toolchain and lld
        run: |
          MINOR=$(xcrun swift --version 2>&1 | sed -n 's/.*Swift version \([0-9]*\.[0-9]*\).*/\1/p' | head -1)
          for v in "$MINOR.6" "$MINOR.5" "$MINOR.4" "$MINOR.3" "$MINOR.2" "$MINOR.1" "$MINOR"; do
            URL="https://download.swift.org/swift-$v-release/xcode/swift-$v-RELEASE/swift-$v-RELEASE-osx.pkg"
            if curl -sfIL "$URL" >/dev/null; then curl -sfL "$URL" -o "$RUNNER_TEMP/swift.pkg"; break; fi
          done
          sudo installer -pkg "$RUNNER_TEMP/swift.pkg" -target /
          TOOLCHAIN=$(ls -d /Library/Developer/Toolchains/swift-*-RELEASE.xctoolchain | head -1)
          echo "TOOLCHAIN=$TOOLCHAIN" >> "$GITHUB_ENV"
          brew install lld >/dev/null
          echo "LLD=$(brew --prefix lld)/bin/ld64.lld" >> "$GITHUB_ENV"

      - name: Build kiln-build
        working-directory: Toolchain/test/KilnCLI
        run: |
          for f in ../../../Kiln/Build/*.swift ../../../Kiln/Project/ZipArchive.swift; do
            case "$(basename "$f")" in BuildCoordinator.swift) continue ;; esac
            cp "$f" Sources/kiln-build/
          done
          swift build -c release 2>&1 | tail -30
          test -x .build/release/kiln-build

      - name: Show how Apple's FoundationModels macros expand
        continue-on-error: true
        run: |
          xcrun swiftc -target arm64-apple-ios26.0 -sdk "$(xcrun --sdk iphoneos --show-sdk-path)" -typecheck \
            -Xfrontend -dump-macro-expansions Toolchain/test/macro-samples/GenerableSample.swift 2>&1 | head -400
          SDK="$(xcrun --sdk iphoneos --show-sdk-path)"
          IFACE=$(ls "$SDK"/System/Library/Frameworks/FoundationModels.framework/Modules/FoundationModels.swiftmodule/arm64e-apple-ios.swiftinterface)
          grep -nE "macro Generable|macro Guide|protocol Generable|protocol ConvertibleFromGeneratedContent|protocol ConvertibleToGeneratedContent|struct GenerationSchema|struct Property|init\(name|public init\(type|struct GenerationID|struct GenerationGuide|func value|init\(properties|init\(kind|struct GeneratedContent|enum Kind|init\(_ content|static func anyOf|init\(type:.*anyOf" "$IFACE" | head -120

      - name: Build Kiln's FoundationModelsMacros and expand the sample with it
        run: |
          cp Toolchain/macros/FoundationModelsMacros/FoundationModelsMacros.swift Toolchain/test/MacroCheck/Sources/FoundationModelsMacros/
          (cd Toolchain/test/MacroCheck && swift build -c release 2>&1 | tail -20)
          KILN_MACROS="$PWD/Toolchain/test/MacroCheck/.build/release/FoundationModelsMacros"
          echo "KILN_MACROS=$KILN_MACROS" >> "$GITHUB_ENV"
          xcrun swiftc -target arm64-apple-ios26.0 -sdk "$(xcrun --sdk iphoneos --show-sdk-path)" -typecheck \
            -load-plugin-executable "$KILN_MACROS#FoundationModelsMacros" \
            -Xfrontend -dump-macro-expansions Toolchain/test/macro-samples/GenerableSample.swift 2>&1 | tail -80
          xcrun swiftc -target arm64-apple-ios26.0 -sdk "$(xcrun --sdk iphoneos --show-sdk-path)" -typecheck \
            -load-plugin-executable "$KILN_MACROS#FoundationModelsMacros" Toolchain/test/macro-samples/GenerableSample.swift
          echo "Kiln's FoundationModelsMacros: sample type-checks"

      - name: Fetch the project
        run: |
          git clone --depth 1 ${PROJECT_REF:+--branch "$PROJECT_REF"} "https://github.com/$PROJECT_REPO" "$RUNNER_TEMP/project"
          ls "$RUNNER_TEMP/project"

      - name: Build it the way Kiln does
        env:
          KILN_GITHUB_TOKEN: ${{ github.token }}
        run: |
          # …/XcodeDefault.xctoolchain (swift is in its usr/bin).
          XCODE_TOOLCHAIN="$(dirname "$(dirname "$(dirname "$(xcrun --find swift)")")")"
          # Apple's closed macros (PreviewsMacros, FoundationModelsMacros) are in the platform folder.
          PLATFORM="$(xcrun --sdk iphoneos --show-sdk-platform-path)"
          PLATFORM_PLUGINS=""
          for dir in "$PLATFORM/Developer/usr/lib/swift/host/plugins" "$PLATFORM/Developer/usr/local/lib/swift/host/plugins" \
                     "$(xcode-select -p)/usr/lib/swift/host/plugins" "$XCODE_TOOLCHAIN/usr/lib/swift/host/plugins"; do
            if [ -d "$dir" ]; then
              echo "== $dir"; ls "$dir"
              PLATFORM_PLUGINS="$PLATFORM_PLUGINS -external-plugin-path $dir#$XCODE_TOOLCHAIN/usr/bin/swift-plugin-server"
            fi
          done
          export KILN_SWIFT_FRONTEND="$TOOLCHAIN/usr/bin/swift-frontend"
          export KILN_SWIFT_RESOURCES="$TOOLCHAIN/usr/lib/swift"
          export KILN_LLD="$LLD"
          export KILN_PLUGIN_ARGS="-load-plugin-executable $KILN_MACROS#FoundationModelsMacros -plugin-path $TOOLCHAIN/usr/lib/swift/host/plugins -in-process-plugin-server-path $TOOLCHAIN/usr/lib/swift/host/libSwiftInProcPluginServer.dylib $PLATFORM_PLUGINS"
          Toolchain/test/KilnCLI/.build/release/kiln-build "$RUNNER_TEMP/project" 2>&1 | tee "$RUNNER_TEMP/kiln-build.log"
          exit ${PIPESTATUS[0]}

      - name: Upload the log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kiln-build-log
          path: ${{ runner.temp }}/kiln-build.log
