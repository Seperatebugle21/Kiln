name: Pipeline Test

# Runs Kiln's compile-and-link pipeline on a Mac with the open-source Swift toolchain from swift.org
# (the same compiler sources as Kiln's iOS build): frontend-mode compile of a SwiftUI app against the
# iPhoneOS SDK, then ld64.lld into a dylib exporting kiln_entry.

on:
  workflow_dispatch:
  push:
    branches:
      - "claude/**"
    paths:
      - ".github/workflows/pipeline-test.yml"
      - "Toolchain/test/**"
      - "Kiln/Signing/**"
      - "Kiln/Build/MiniYAML.swift"

jobs:
  project-reader:
    runs-on: macos-26
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Test the YAML reader on an XcodeGen project
        run: |
          xcrun swiftc -o "$RUNNER_TEMP/yamlcli" Kiln/Build/MiniYAML.swift Toolchain/test/YAMLCLI/main.swift
          "$RUNNER_TEMP/yamlcli" Toolchain/test/YAMLCLI/project.yml

  pipeline:
    runs-on: macos-26
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: List the SDK's external macros
        run: |
          SDK="$(xcrun --sdk iphoneos --show-sdk-path)"
          grep -rhoE '#externalMacro\(module: *"[A-Za-z_]+", *type: *"[A-Za-z_]+"\)' \
            "$SDK/System/Library/Frameworks" "$SDK/usr/lib/swift" --include='*.swiftinterface' | sort | uniq -c | sort -rn
          echo "--- macro declarations in SwiftUI / DeveloperToolsSupport"
          grep -rhE -B2 '#externalMacro\(module: *"(SwiftUIMacros|PreviewsMacros)"' \
            "$SDK/System/Library/Frameworks" --include='arm64e-apple-ios.swiftinterface' | grep -E 'macro |externalMacro' | sort -u | head -40

      - name: Install the swift.org toolchain
        run: |
          xcrun swift --version
          MINOR=$(xcrun swift --version 2>&1 | sed -n 's/.*Swift version \([0-9]*\.[0-9]*\).*/\1/p' | head -1)
          for v in "$MINOR.6" "$MINOR.5" "$MINOR.4" "$MINOR.3" "$MINOR.2" "$MINOR.1" "$MINOR"; do
            URL="https://download.swift.org/swift-$v-release/xcode/swift-$v-RELEASE/swift-$v-RELEASE-osx.pkg"
            if curl -sfIL "$URL" >/dev/null; then
              echo "Using Swift $v: $URL"
              curl -sfL "$URL" -o "$RUNNER_TEMP/swift.pkg"
              break
            fi
          done
          test -f "$RUNNER_TEMP/swift.pkg" || { echo "::error::No swift.org toolchain found for Swift $MINOR"; exit 1; }
          sudo installer -pkg "$RUNNER_TEMP/swift.pkg" -target /
          TOOLCHAIN=$(ls -d /Library/Developer/Toolchains/swift-*-RELEASE.xctoolchain | head -1)
          echo "TOOLCHAIN=$TOOLCHAIN" >> "$GITHUB_ENV"
          "$TOOLCHAIN/usr/bin/swift-frontend" --version

      - name: Install lld
        run: |
          brew install lld
          LLD="$(brew --prefix lld)/bin/ld64.lld"
          "$LLD" --version
          echo "LLD=$LLD" >> "$GITHUB_ENV"

      - name: Build swift-numerics like Kiln (with and without module aliases)
        continue-on-error: true
        run: Toolchain/test/numerics-test.sh "$TOOLCHAIN/usr/bin/swift-frontend" "$RUNNER_TEMP/numerics"

      - name: Compile and link HelloKiln for iOS
        run: Toolchain/test/pipeline-test.sh "$TOOLCHAIN/usr/bin/swift-frontend" "$LLD" "$RUNNER_TEMP/pipeline"

      - name: Sign HelloKiln with Kiln's signer
        run: Toolchain/test/sign-test.sh "$RUNNER_TEMP/pipeline/HelloKiln.dylib" "$RUNNER_TEMP/signing"

      - name: Upload result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pipeline-test
          path: |
            ${{ runner.temp }}/pipeline/HelloKiln.dylib
            ${{ runner.temp }}/pipeline/HelloKiln.o
            ${{ runner.temp }}/signing/signed.dylib
          if-no-files-found: ignore
          retention-days: 7
